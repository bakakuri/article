<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">B2 Upper Intermediate German learning level badge</title>
  <desc id="desc">Glossy 3D-inspired educational badge for CEFR level B2.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A18"/><stop offset="1" stop-color="#A83B00"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4A8"/><stop offset=".45" stop-color="#FFD75A"/><stop offset="1" stop-color="#D99B19"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#08111F" flood-opacity=".28"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <ellipse cx="300" cy="545" rx="205" ry="24" fill="#09121F" opacity=".18" filter="url(#soft)"/>

  <g filter="url(#shadow)">
    <path d="M300 35 L455 92 Q520 116 535 180 L520 430 Q514 485 465 515 L300 570 L135 515 Q86 485 80 430 L65 180 Q80 116 145 92 Z"
          fill="url(#bg)" stroke="url(#edge)" stroke-width="8"/>
    <path d="M300 58 L442 109 Q494 128 506 184 L492 416 Q487 458 450 482 L300 535 L150 482 Q113 458 108 416 L94 184 Q106 128 158 109 Z"
          fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="3"/>

    <!-- decorative leaves -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="8" stroke-linecap="round">
      <path d="M112 400 C72 360 72 300 108 255"/>
      <path d="M488 400 C528 360 528 300 492 255"/>
    </g>
    <g fill="#FFFFFF" opacity=".52">
      <ellipse cx="101" cy="355" rx="10" ry="24" transform="rotate(-35 101 355)"/>
      <ellipse cx="92" cy="318" rx="10" ry="24" transform="rotate(-50 92 318)"/>
      <ellipse cx="101" cy="281" rx="10" ry="24" transform="rotate(-65 101 281)"/>
      <ellipse cx="499" cy="355" rx="10" ry="24" transform="rotate(35 499 355)"/>
      <ellipse cx="508" cy="318" rx="10" ry="24" transform="rotate(50 508 318)"/>
      <ellipse cx="499" cy="281" rx="10" ry="24" transform="rotate(65 499 281)"/>
    </g>

    <!-- educational icon -->
    <circle cx="300" cy="170" r="86" fill="#071A32" opacity=".24"/>
    <circle cx="300" cy="160" r="78" fill="#FFFFFF" opacity=".11" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="3"/>
    <text x="300" y="188" text-anchor="middle" font-size="88" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif">💻</text>

    <!-- German speech bubble -->
    <g transform="translate(394 112)">
      <rect x="0" y="0" width="118" height="58" rx="29" fill="#FFFFFF" opacity=".96"/>
      <path d="M28 55 L18 74 L50 56" fill="#FFFFFF"/>
      <text x="59" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#A83B00">DE</text>
    </g>

    <!-- CEFR -->
    <text x="300" y="335" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif" font-size="128" font-weight="900"
          letter-spacing="2" fill="#FFFFFF" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="3">B2</text>

    <!-- ribbon -->
    <path d="M93 375 Q300 345 507 375 L490 445 Q300 420 110 445 Z" fill="url(#gold)" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="3"/>
    <path d="M93 375 L47 398 L91 426 L110 445 Z" fill="#A83B00" opacity=".85"/>
    <path d="M507 375 L553 398 L509 426 L490 445 Z" fill="#A83B00" opacity=".85"/>
    <text x="300" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="18" font-weight="800" fill="#101828">ნიჭიერი</text>

    <!-- stars -->
    <g fill="url(#gold)">
      <text x="152" y="150" font-size="28">↗</text>
      <text x="430" y="225" font-size="22">↗</text>
      <text x="178" y="500" font-size="20">✦</text>
      <text x="405" y="500" font-size="20">✦</text>
    </g>

    <!-- small level marker -->
    <circle cx="300" cy="493" r="24" fill="#FFFFFF" fill-opacity=".12" stroke="#FFFFFF" stroke-opacity=".25"/>
    <text x="300" y="501" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">B</text>
  </g>
</svg>
