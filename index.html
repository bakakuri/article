<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#020512">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="description" content="LinguaFlow — ისწავლე უცხო ენა ქართულად">
  <title>LinguaFlow</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>


<!-- ══════════════════════════════════════════════
     AUTH LAYER
══════════════════════════════════════════════ -->
<div id="auth-layer">

  <!-- LOGIN -->
  <div id="view-login" class="auth-view active">
    <div class="auth-inner">
      <div class="auth-logo">
        <div class="auth-diamond">💎</div>
        <div class="auth-app-name">LinguaFlow</div>
      </div>
      <p class="auth-tagline">ისწავლე ახალი ენა ქართულად</p>
      <div class="auth-card">
        <h2 class="auth-card-title">შესვლა</h2>
        <div class="field">
          <label class="field-label">ელ-ფოსტა</label>
          <input class="field-input" type="email" id="login-email" placeholder="name@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label class="field-label">პაროლი</label>
          <input class="field-input" type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div class="auth-error" id="login-error"></div>
        <button class="auth-submit" id="btn-login">შესვლა →</button>
        <p class="auth-alt">ანგარიში არ გაქვს? <span class="auth-link" id="go-register">დარეგისტრირდი</span></p>
      </div>
    </div>
  </div>

  <!-- REGISTER -->
  <div id="view-register" class="auth-view">
    <div class="auth-inner">
      <div class="auth-logo">
        <div class="auth-diamond">💎</div>
        <div class="auth-app-name">LinguaFlow</div>
      </div>
      <p class="auth-tagline">ისწავლე ახალი ენა ქართულად</p>
      <div class="auth-card">
        <h2 class="auth-card-title">რეგისტრაცია</h2>
        <div class="field">
          <label class="field-label">სახელი (nickname)</label>
          <input class="field-input" type="text" id="reg-username" placeholder="შენი სახელი" autocomplete="username">
        </div>
        <div class="field">
          <label class="field-label">ელ-ფოსტა</label>
          <input class="field-input" type="email" id="reg-email" placeholder="name@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label class="field-label">პაროლი</label>
          <input class="field-input" type="password" id="reg-password" placeholder="მინ. 6 სიმბოლო" autocomplete="new-password">
        </div>
        <div class="auth-error" id="reg-error"></div>
        <button class="auth-submit" id="btn-register">დარეგისტრირება →</button>
        <p class="auth-alt">უკვე დარეგისტრირებული ხარ? <span class="auth-link" id="go-login">შესვლა</span></p>
      </div>
    </div>
  </div>

</div>


<!-- ══════════════════════════════════════════════
     APP LAYER
══════════════════════════════════════════════ -->
<div id="app-layer" style="display:none">

  <header class="header">
    <div class="brand">
      <div class="diamond">💎</div>
      <div class="brand-name" id="app-brand-name">LinguaFlow</div>
    </div>
    <div class="header-right">
      <div class="pill" id="hdr-streak">🔥 0</div>
      <div class="pill xp" id="hdr-xp">⭐ 0 XP</div>
      <div class="avatar" id="hdr-avatar">👤</div>
    </div>
  </header>

  <div class="app-content">
    <div id="page-home"       class="app-page active"></div>
    <div id="page-words"      class="app-page"></div>
    <div id="page-statistics" class="app-page"></div>
    <div id="page-challenges" class="app-page"></div>
    <div id="page-more"       class="app-page"></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home">
      <span class="nav-icon">⌂</span>მთავარი
    </button>
    <button class="nav-item" data-page="words">
      <span class="nav-icon">▤</span>სიტყვები
    </button>
    <button class="nav-item" data-page="statistics">
      <span class="nav-icon">▥</span>სტატისტიკა
    </button>
    <button class="nav-item" data-page="challenges">
      <span class="nav-icon">♜</span>ჩელენჯები
    </button>
    <button class="nav-item" data-page="more">
      <span class="nav-icon">☷</span>მეტი
    </button>
  </nav>

</div>


<!-- ══════════════════════════════════════════════
     FLASHCARD OVERLAY
══════════════════════════════════════════════ -->
<div class="fc-overlay" id="fc-overlay">
  <div class="fc-header">
    <button class="fc-close" id="fc-close">×</button>
    <div class="fc-progress-wrap">
      <div class="fc-progress-fill" id="fc-prog"></div>
    </div>
    <div class="fc-counter" id="fc-counter">1 / 10</div>
  </div>
  <div class="fc-card-wrap" id="fc-card-wrap">
    <div class="fc-card" id="fc-card">
      <div class="fc-card-inner">
        <div class="fc-face fc-front">
          <div class="fc-article" id="fc-article"></div>
          <div class="fc-word"    id="fc-word">---</div>
          <div class="fc-tap-hint">შეეხე გადასაბრუნებლად</div>
        </div>
        <div class="fc-face fc-back">
          <div class="fc-lang"        id="fc-lang">ქართული</div>
          <div class="fc-translation" id="fc-trans">---</div>
        </div>
      </div>
    </div>
  </div>
  <p class="fc-hint-text" id="fc-hint">შეეხე ბარათს გადასატრიალებლად</p>
  <div class="fc-actions" id="fc-actions" style="display:none">
    <button class="fc-btn-no"  id="fc-no">✗ არ ვიცოდი</button>
    <button class="fc-btn-yes" id="fc-yes">✓ ვიცოდი</button>
  </div>
</div>


<!-- ══════════════════════════════════════════════
     MODAL
══════════════════════════════════════════════ -->
<div class="modal" id="modal">
  <div class="modal-box">
    <button class="modal-close" id="modal-close">×</button>
    <h2 class="modal-title" id="modal-title"></h2>
    <div id="modal-content"></div>
  </div>
</div>


<!-- ══════════════════════════════════════════════
     TOAST
══════════════════════════════════════════════ -->
<div class="toast" id="toast"></div>


<!-- ══════════════════════════════════════════════
     ADMIN OVERLAY
══════════════════════════════════════════════ -->
<div class="admin-overlay" id="admin-overlay">
  <div class="admin-header">
    <div class="admin-title">🛡️ ადმინ პანელი</div>
    <button class="admin-close" id="admin-close">×</button>
  </div>
  <nav class="admin-nav" id="admin-nav">
    <button class="admin-tab active" data-tab="dashboard">📊 Dashboard</button>
    <button class="admin-tab"        data-tab="words">📝 სიტყვები</button>
    <button class="admin-tab"        data-tab="users">👥 მომხმარებლები</button>
  </nav>
  <div class="admin-body" id="admin-body"></div>
</div>


<!-- ══════════════════════════════════════════════
     SCRIPTS — load order is important
══════════════════════════════════════════════ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/words.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/admin.js"></script>
<script src="assets/js/main.js"></script>

</body>
</html>
