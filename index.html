<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#020512">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>LinguaFlow</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ══ AUTH ══════════════════════════════════════════════ -->
<div id="auth-layer">
  <div id="view-login" class="auth-view active">
    <div class="auth-inner">
      <div class="auth-logo"><div class="auth-diamond">💎</div><div class="auth-app-name">LinguaFlow</div></div>
      <p class="auth-tagline">ისწავლე ახალი ენა ქართულად</p>
      <div class="auth-card">
        <h2 class="auth-card-title">შესვლა</h2>
        <div class="field"><label class="field-label">ელ-ფოსტა</label><input class="field-input" type="email" id="login-email" placeholder="name@example.com" autocomplete="email"></div>
        <div class="field"><label class="field-label">პაროლი</label><input class="field-input" type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"></div>
        <div class="auth-error" id="login-error"></div>
        <button class="auth-submit" id="btn-login">შესვლა →</button>
        <p class="auth-alt">ანგარიში არ გაქვს? <span class="auth-link" id="go-register">დარეგისტრირდი</span></p>
      </div>
    </div>
  </div>
  <div id="view-register" class="auth-view">
    <div class="auth-inner">
      <div class="auth-logo"><div class="auth-diamond">💎</div><div class="auth-app-name">LinguaFlow</div></div>
      <p class="auth-tagline">ისწავლე ახალი ენა ქართულად</p>
      <div class="auth-card">
        <h2 class="auth-card-title">რეგისტრაცია</h2>
        <div class="field"><label class="field-label">სახელი</label><input class="field-input" type="text" id="reg-username" placeholder="შენი სახელი" autocomplete="username"></div>
        <div class="field"><label class="field-label">ელ-ფოსტა</label><input class="field-input" type="email" id="reg-email" placeholder="name@example.com" autocomplete="email"></div>
        <div class="field"><label class="field-label">პაროლი</label><input class="field-input" type="password" id="reg-password" placeholder="მინ. 6 სიმბოლო" autocomplete="new-password"></div>
        <div class="auth-error" id="reg-error"></div>
        <button class="auth-submit" id="btn-register">დარეგისტრირება →</button>
        <p class="auth-alt">უკვე დარეგისტრირებული ხარ? <span class="auth-link" id="go-login">შესვლა</span></p>
      </div>
    </div>
  </div>
</div>

<!-- ══ APP ════════════════════════════════════════════════ -->
<div id="app-layer" style="display:none">

  <header class="header">
    <div class="brand">
      <div class="diamond">💎</div>
      <div class="brand-name" id="app-brand-name">LinguaFlow</div>
    </div>
    <div class="header-right">
      <div class="pill" id="hdr-streak">🔥 0</div>
      <div class="pill xp" id="hdr-xp">⭐ 0 XP</div>
      <div class="avatar" id="hdr-avatar">👤</div>
    </div>
  </header>

  <div class="app-content">
    <div id="page-home"       class="app-page active"></div>
    <div id="page-words"      class="app-page"></div>
    <div id="page-statistics" class="app-page"></div>
    <div id="page-challenges" class="app-page"></div>
    <div id="page-more"       class="app-page"></div>
    <div id="page-learned"    class="app-page"></div>
    <div id="page-review"     class="app-page"></div>
  </div>

  <!-- ORIGINAL 5-ITEM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home">
      <img class="nav-icon" src="assets/images/home.svg" alt="">
    </button>
    <button class="nav-item" data-page="words">
      <img class="nav-icon" src="assets/images/vocabulary.svg" alt="">
    </button>
    <button class="nav-item" data-page="statistics">
      <img class="nav-icon" src="assets/images/statistics.svg" alt="">
    </button>
    <button class="nav-item" data-page="challenges">
      <img class="nav-icon" src="assets/images/learned.svg" alt="">
    </button>
    <button class="nav-item" data-page="more">
      <img class="nav-icon" src="assets/images/menu.svg" alt="">
    </button>
  </nav>

</div>

<!-- ══ FLASHCARD OVERLAY (FC3) ════════════════════════════ -->
<div class="fc-overlay" id="fc-overlay">

  <div class="fc-header">
    <button class="fc-close" id="fc-close">×</button>
    <div class="fc-progress-wrap"><div class="fc-progress-fill" id="fc-prog"></div></div>
  </div>

  <div class="fc-card-wrap">
    <div class="fc3-scene">
      <div class="fc3-card" id="fc3-card">
        <div class="fc3-face fc3-front" id="fc3-front"></div>
        <div class="fc3-face fc3-back"  id="fc3-back"></div>
      </div>
    </div>
  </div>

  <div class="fc3-nav-row">
    <button class="fc3-nav-btn" id="fc3-prev">‹</button>
    <div class="fc3-nav-ctr" id="fc-counter">1 / 10</div>
    <button class="fc3-nav-btn" id="fc3-next">›</button>
  </div>

  <div class="fc-rating" id="fc-rating" style="display:none">
    <button class="fc-rate-btn fc-rate-hard"   id="fc-hard">↩ ძ. რთული</button>
    <button class="fc-rate-btn fc-rate-medium" id="fc-medium">🔄 ისე რა</button>
    <button class="fc-rate-btn fc-rate-easy"   id="fc-easy">✅ ადვილი</button>
  </div>

</div>

<!-- ══ MODAL ══════════════════════════════════════════════ -->
<div class="modal" id="modal">
  <div class="modal-box">
    <button class="modal-close" id="modal-close">×</button>
    <h2 class="modal-title" id="modal-title"></h2>
    <div id="modal-content"></div>
  </div>
</div>

<!-- ══ ADMIN ══════════════════════════════════════════════ -->
<div class="admin-overlay" id="admin-overlay">
  <div class="admin-header">
    <div class="admin-title">🛡️ ადმინ პანელი</div>
    <button class="admin-close" id="admin-close">×</button>
  </div>
  <nav class="admin-nav" id="admin-nav">
    <button class="admin-tab active" data-tab="dashboard">📊 Dashboard</button>
    <button class="admin-tab" data-tab="words">📝 სიტყვები</button>
    <button class="admin-tab" data-tab="users">👥 მომხმარებლები</button>
  </nav>
  <div class="admin-body" id="admin-body"></div>
</div>

<!-- ══ TOAST ══════════════════════════════════════════════ -->
<div class="toast" id="toast"></div>

<!-- ══ SCRIPTS ════════════════════════════════════════════ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/words.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pages/home.js"></script>
<script src="assets/js/pages/words-page.js"></script>
<script src="assets/js/pages/statistics.js"></script>
<script src="assets/js/pages/challenges.js"></script>
<script src="assets/js/pages/profile.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/admin.js"></script>
<script src="assets/js/flashcard.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
